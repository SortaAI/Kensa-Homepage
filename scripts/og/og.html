<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Poppins,sans-serif;color:#0E2A3B;background:#F8F4F1}
.c{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.mark{position:absolute;right:-70px;bottom:-90px;width:460px;opacity:.06}
.logo{height:46px;align-self:flex-start}
.tag{display:inline-block;font-size:22px;font-weight:500;color:#18648A;background:rgba(255,255,255,.75);border-radius:999px;padding:8px 20px;margin-bottom:26px}
h1{font-size:68px;line-height:1.06;letter-spacing:-2.2px;font-weight:600;max-width:960px}
h1.s{font-size:56px;letter-spacing:-1.6px}
h1.xs{font-size:48px;letter-spacing:-1.2px}
.dot{color:#E0987A}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#4B5D69}
</style></head><body><div class="c" id="c">
<img class="mark" id="mark">
<img class="logo" id="logo">
<div><span class="tag" id="tag"></span><h1 id="h"></h1></div>
<div class="foot"><span>holakensa.com</span><span>Software para clínicas en México</span></div>
</div></body></html>
